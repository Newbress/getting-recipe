spring:
  application:
    name: getting-recipe
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리한다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# Gemini 설정 (API 키는 환경변수로만 주입한다)
gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: https://generativelanguage.googleapis.com
  # 공식 문서(models) 기준 현재 권장 모델. gemini-2.5-flash 는 deprecated 라서 사용하지 않는다
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  timeout-seconds: 120
  # true 면 Gemini 를 호출하지 않고 샘플 레시피를 반환한다 (로컬 개발용)
  mock: ${GEMINI_MOCK:false}

youtube:
  api-key: ${YOUTUBE_API_KEY:}
  base-url: https://www.googleapis.com

management:
  endpoints:
    web:
      exposure:
        include: health,info
