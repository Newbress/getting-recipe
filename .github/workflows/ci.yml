name: CI

# 모든 PR에서 빌드 + 테스트(Testcontainers 포함)를 실행한다.
# 브랜치 보호 규칙에서 이 워크플로(build-and-test)를 필수 체크로 지정해 실패 시 병합을 막는다.
on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # Docker 기본 제공 -> Testcontainers 사용 가능
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & Test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  # TODO(5단계): 프론트엔드(/frontend)가 추가되면 lint/test/build job을 여기에 추가한다
